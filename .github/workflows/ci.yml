name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      # Robolectric downloads an Android runtime per version tested on first use; kept between
      # runs, so a network hiccup at that download can't fail the unit tests. Keyed on what decides
      # which runtimes are needed: Robolectric's version, the tests' @Config(sdk) levels and compileSdk.
      - name: Robolectric cache key
        id: robolectric
        run: |
          version=$(sed -nE 's/^robolectric = "(.*)"/\1/p' gradle/libs.versions.toml)
          levels=$( { { grep -rhoE 'sdk = \[[0-9, ]+\]' kirora-sdk*/src/test || true; } | tr -dc '0-9,\n' | tr ',' '\n'; \
            sed -nE 's/^ *compileSdk = ([0-9]+).*/\1/p' kirora-sdk*/build.gradle.kts; } | sed '/^$/d' | sort -un | paste -sd- -)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "key=robolectric-$version-sdk-$levels" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: ${{ steps.robolectric.outputs.key }}
          restore-keys: robolectric-${{ steps.robolectric.outputs.version }}-
      - name: Unit tests
        run: ./gradlew :kirora-sdk:testDebugUnitTest :kirora-sdk-push:testDebugUnitTest
      - name: Lint
        run: ./gradlew :kirora-sdk:lintDebug :kirora-sdk-push:lintDebug
      - name: Public API unchanged (./gradlew apiDump records an intended change)
        run: ./gradlew :kirora-sdk:apiCheck :kirora-sdk-push:apiCheck
      - name: Release builds (SDK artifacts and R8-minified sample)
        run: ./gradlew :kirora-sdk:assembleRelease :kirora-sdk-push:assembleRelease :app:assembleRelease
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit tests
        run: ./gradlew :kirora-sdk:testDebugUnitTest :kirora-sdk-push:testDebugUnitTest
      - name: Lint
        run: ./gradlew :kirora-sdk:lintDebug :kirora-sdk-push:lintDebug
      - name: Public API unchanged (./gradlew apiDump records an intended change)
        run: ./gradlew :kirora-sdk:apiCheck :kirora-sdk-push:apiCheck
      - name: Release builds (SDK artifacts and R8-minified sample)
        run: ./gradlew :kirora-sdk:assembleRelease :kirora-sdk-push:assembleRelease :app:assembleRelease
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
